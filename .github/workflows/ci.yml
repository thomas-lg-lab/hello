# CI: the project's checks, then the image, so nothing is published that did not pass them.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # release-drafter.yml dispatches this workflow on the tag a published release creates.
  workflow_dispatch:

permissions: {}

# A newer push to a PR cancels its run; main and tags never cancel, a publish must not stop mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # gofmt, go vet and the tests, in the same Go image as the Dockerfile's build stage.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: golang:1.27@sha256:5f1b98fa02fe396ebce2a0227a0e08309e11792915b9dd2e1f71053d7e7e6666
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Build, runtime contract test and Trivy gate on every PR; edge and sha-* from main; X.Y.Z and latest from a release
  # tag. The contract test is the lab's: the image must run as the cluster runs it.
  image:
    needs: [checks]
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
    uses: thomas-lg-lab/.github/.github/workflows/container-image.yml@35e66e4e8cf3abc1ca49e81e43543c077b64ff64 # v2.5.0
    with:
      # A new edge is followed at once by the lab: Renovate bumps the digest in the deployment repository.
      lab-update: true
      contract-test: true
    secrets:
      DEPLOY_APP_CLIENT_ID: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
